server {
    listen 80;
    server_name localhost;
    root /var/www/horde/web;
    index index.php;

    access_log /var/log/nginx/horde-test-access.log;
    error_log /var/log/nginx/horde-test-error.log;

    location / {
        try_files $uri $uri/ /horde/rampage.php?$query_string;
    }

    location ~ ^/rpc\.php$ {
        rewrite ^/rpc\.php$ /horde/rpc.php last;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # Pass Authorization header
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    }

    location ~ /\.(ht|git) {
        deny all;
    }

    location ~ /(composer|package)\.json$ {
        deny all;
    }
}
