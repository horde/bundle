name: Ubuntu 24.04 LAMP Integration Test

# Thin wrapper: hands (db, webserver, php) tuples to the reusable
# integration-test.yml. The interesting logic lives there.
#
# LAMP matrix runs on PHP 8.3 and 8.4 to catch FPM-version-specific
# regressions that the composer-install-matrix can't see (it doesn't
# stand up a running web server).

on:
  workflow_dispatch:
  pull_request:
    branches: ['FRAMEWORK_6_0']
  schedule:
    - cron: '23 2 * * *'

jobs:
  lamp:
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    name: lamp (mysql + apache2 + php${{ matrix.php }})
    uses: ./.github/workflows/integration-test.yml
    with:
      db: mysql
      webserver: apache2
      php: ${{ matrix.php }}
    secrets: inherit
