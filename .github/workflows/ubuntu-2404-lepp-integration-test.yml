name: Ubuntu 24.04 LEPP Integration Test (experimental)

# EXPERIMENTAL: nginx + PostgreSQL stack. hordectl's doc/INSTALL_HORDE.md
# lists PostgreSQL under "coming later"; hordectl configure database
# accepts --type=pgsql and threads through to the DSN, but the runtime
# has not been end-to-end verified across every Horde migration. Keep
# this workflow cron-only (no PR gate) until the next green nightly
# streak confirms it works. Do NOT promote to PR-triggered without
# an intentional decision.

on:
  workflow_dispatch:
  schedule:
    - cron: '27 2 * * *'

jobs:
  lepp:
    name: lepp (pgsql + nginx + php8.4) [experimental]
    uses: ./.github/workflows/integration-test.yml
    with:
      db: pgsql
      webserver: nginx
      php: '8.4'
    secrets: inherit
